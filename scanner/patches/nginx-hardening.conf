# Nginx Hardening Configuration
# Drop this into the `server` block or as an included conf file.

# Hide Nginx version
server_tokens off;

# Deny access to hidden files (.env, .git, .DS_Store, etc.)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

# Block unnecessary HTTP methods
if ($request_method !~ ^(GET|HEAD|POST|OPTIONS|PUT|DELETE)$ ) {
    return 405;
}

# Specific block for TRACE/TRACK methods
if ($request_method ~ ^(TRACE|TRACK)$ ) {
    return 405;
}

# Block access to common backup and source files
location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
    deny all;
}

# Restrict access to Nginx status page
location /nginx_status {
    stub_status on;
    access_log off;
    allow 127.0.0.1;
    # allow 10.0.0.0/8; # Allow internal network
    deny all;
}
